<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown for O/Ls</title>
    <meta
        name="description"
        content="A real-time countdown to December 6th, 23:59:59."
    >

    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="Countdown for O/Ls">
    <meta
        property="og:description"
        content="Counting down to December 6th, 23:59:59."
    >
    <meta property="og:url" content="https://ol.mcboss.top">
    <meta property="og:type" content="website">

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Countdown for O/Ls">
    <meta
        name="twitter:description"
        content="Counting down to December 6th, 23:59:59."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: white;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(93, 76, 255, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 210, 255, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #080914 0%,
                    #10132b 45%,
                    #090b18 100%
                );
        }

        /* Ambient background glow */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.045) 0,
                    transparent 40%
                );

            animation: ambient 15s ease-in-out infinite alternate;
        }

        @keyframes ambient {
            from {
                transform: translate(-3%, -2%) scale(1);
            }

            to {
                transform: translate(3%, 2%) scale(1.08);
            }
        }

        .page {
            position: relative;
            z-index: 1;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .card {
            width: min(1000px, 100%);

            padding: 60px 50px;

            text-align: center;

            background: rgba(15, 17, 38, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .label {
            display: inline-block;

            margin-bottom: 18px;
            padding: 8px 16px;

            border-radius: 999px;

            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.7);

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 {
            font-size: clamp(40px, 7vw, 82px);
            line-height: 1;

            letter-spacing: -3px;

            margin-bottom: 18px;

            background:
                linear-gradient(
                    120deg,
                    #ffffff,
                    #cbd2ff 45%,
                    #91eaff
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .target {
            color: rgba(255, 255, 255, 0.55);
            font-size: clamp(14px, 2vw, 18px);
            margin-bottom: 48px;
        }

        .countdown {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 18px;
        }

        .unit {
            min-width: 0;

            padding: 25px 15px;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.035);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .unit:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
        }

        .number {
            display: block;

            font-variant-numeric: tabular-nums;

            font-size: clamp(35px, 6vw, 64px);
            font-weight: 700;
            line-height: 1;

            letter-spacing: -2px;
        }

        .name {
            display: block;

            margin-top: 10px;

            color: rgba(255, 255, 255, 0.45);

            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 38px;

            color: rgba(255, 255, 255, 0.3);

            font-size: 12px;
        }

        @media (max-width: 650px) {
            .page {
                padding: 14px;
            }

            .card {
                padding: 42px 20px;
                border-radius: 24px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .target {
                margin-bottom: 32px;
            }

            .countdown {
                gap: 8px;
            }

            .unit {
                padding: 20px 8px;
                border-radius: 16px;
            }

            .number {
                font-size: clamp(28px, 9vw, 45px);
            }

            .name {
                font-size: 9px;
                letter-spacing: 1px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding-left: 12px;
                padding-right: 12px;
            }

            .countdown {
                gap: 5px;
            }

            .unit {
                padding-left: 4px;
                padding-right: 4px;
            }
        }
    </style>
</head>

<body>

    <main class="page">
        <section class="card">

            <div class="label">O/Ls Countdown</div>

            <h1>Countdown for O/Ls</h1>

            <div class="target">
                December 6th, 2026 · 23:59:59
            </div>

            <div class="countdown">

                <div class="unit">
                    <span class="number" id="days">0</span>
                    <span class="name">Days</span>
                </div>

                <div class="unit">
                    <span class="number" id="hours">00</span>
                    <span class="name">Hours</span>
                </div>

                <div class="unit">
                    <span class="number" id="minutes">00</span>
                    <span class="name">Minutes</span>
                </div>

                <div class="unit">
                    <span class="number" id="seconds">00</span>
                    <span class="name">Seconds</span>
                </div>

            </div>

            <div class="footer">
                Every second counts.
            </div>

        </section>
    </main>

    <script>
        /*
         * December 6th, 2026 at 23:59:59
         *
         * The date is interpreted using the visitor's local timezone.
         */
        const targetDate = new Date(
            "2026-12-06T23:59:59"
        ).getTime();

        const daysElement = document.getElementById("days");
        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");

        function pad(number) {
            return String(number).padStart(2, "0");
        }

        function updateCountdown() {
            const now = Date.now();
            const difference = targetDate - now;

            if (difference <= 0) {
                daysElement.textContent = "0";
                hoursElement.textContent = "00";
                minutesElement.textContent = "00";
                secondsElement.textContent = "00";

                document.querySelector(".target").textContent =
                    "December 6th, 2026 · 23:59:59 — Time's up!";

                return;
            }

            const totalSeconds = Math.floor(difference / 1000);

            const days = Math.floor(
                totalSeconds / 86400
            );

            const hours = Math.floor(
                (totalSeconds % 86400) / 3600
            );

            const minutes = Math.floor(
                (totalSeconds % 3600) / 60
            );

            const seconds = totalSeconds % 60;

            daysElement.textContent = days;
            hoursElement.textContent = pad(hours);
            minutesElement.textContent = pad(minutes);
            secondsElement.textContent = pad(seconds);

            /*
             * Update the social/meta description too.
             * This changes the page metadata while it is open,
             * although social platforms normally cache previews.
             */
            const description =
                `${days} days, ${pad(hours)} hours, ` +
                `${pad(minutes)} minutes and ${pad(seconds)} seconds ` +
                `remaining until December 6th, 2026 at 23:59:59.`;

            document
                .querySelector('meta[name="description"]')
                .setAttribute("content", description);

            document
                .querySelector('meta[property="og:description"]')
                .setAttribute("content", description);

            document
                .querySelector('meta[name="twitter:description"]')
                .setAttribute("content", description);
        }

        updateCountdown();

        // Update once every second.
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
