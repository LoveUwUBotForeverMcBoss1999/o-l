</main>

<script>
    /*
     * Target:
     * December 6th, 2026 at 23:59:59
     *
     * Uses the visitor's local timezone.
     */
    const targetDate =
        new Date("2026-12-06T23:59:59").getTime();

    const daysElement =
        document.getElementById("days");

    const hoursElement =
        document.getElementById("hours");

    const minutesElement =
        document.getElementById("minutes");

    const secondsElement =
        document.getElementById("seconds");

    const millisecondsElement =
        document.getElementById("milliseconds");


    function pad(number, length = 2) {
        return String(number).padStart(length, "0");
    }


    /*
     * Calculates calendar-style months remaining.
     *
     * Example:
     * September -> October = 1 month
     */
    function getMonthDifference(from, to) {
        let months =
            (to.getFullYear() - from.getFullYear()) * 12;

        months +=
            to.getMonth() - from.getMonth();

        if (to.getDate() < from.getDate()) {
            months--;
        }

        return Math.max(0, months);
    }


    function updateCountdown() {

        const now = new Date();

        const currentTime =
            now.getTime();

        const difference =
            targetDate - currentTime;


        if (difference <= 0) {

            daysElement.textContent = "0";
            hoursElement.textContent = "00";
            minutesElement.textContent = "00";
            secondsElement.textContent = "00";
            millisecondsElement.textContent = "000";

            document.querySelector(".target").textContent =
                "December 6th, 2026 · 23:59:59 — TIME'S UP";

            return;
        }


        /*
         * Main countdown
         */

        const totalMilliseconds =
            difference;

        const totalSeconds =
            Math.floor(totalMilliseconds / 1000);


        const days =
            Math.floor(
                totalSeconds / 86400
            );


        const hours =
            Math.floor(
                (totalSeconds % 86400) / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );


        const seconds =
            totalSeconds % 60;


        /*
         * True remaining milliseconds.
         */
        const milliseconds =
            totalMilliseconds % 1000;


        daysElement.textContent =
            days;


        hoursElement.textContent =
            pad(hours);


        minutesElement.textContent =
            pad(minutes);


        secondsElement.textContent =
            pad(seconds);


        millisecondsElement.textContent =
            pad(milliseconds, 3);


        /*
         * Dynamic meta description
         */

        const target =
            new Date(targetDate);


        const months =
            getMonthDifference(
                now,
                target
            );


        /*
         * Calculate calendar remainder
         * after complete months.
         */
        const afterMonths =
            new Date(now);


        afterMonths.setMonth(
            afterMonths.getMonth() + months
        );


        let remainingHours =
            Math.floor(
                (targetDate - afterMonths.getTime()) /
                3600000
            );


        /*
         * Keep the preview readable.
         */
        remainingHours =
            Math.max(0, remainingHours);


        const metaText =
            `${months} Months, ` +
            `${days} Days, ` +
            `${remainingHours} Hours left ` +
            `until December 6th, 2026 at 23:59:59.`;


        document
            .querySelector('meta[name="description"]')
            .setAttribute(
                "content",
                metaText
            );


        document
            .querySelector('meta[property="og:description"]')
            .setAttribute(
                "content",
                metaText
            );


        document
            .querySelector('meta[name="twitter:description"]')
            .setAttribute(
                "content",
                metaText
            );
    }


    /*
     * Run immediately.
     */
    updateCountdown();


    /*
     * Update the normal countdown every second.
     */
    setInterval(
        updateCountdown,
        1000
    );


    /*
     * Milliseconds need much faster updates.
     *
     * requestAnimationFrame keeps this visually
     * smooth without forcing a heavy 1ms interval.
     */
    function updateMilliseconds() {

        const difference =
            targetDate - Date.now();


        if (difference <= 0) {
            millisecondsElement.textContent = "000";
            return;
        }


        const milliseconds =
            difference % 1000;


        millisecondsElement.textContent =
            pad(milliseconds, 3);


        requestAnimationFrame(
            updateMilliseconds
        );
    }


    requestAnimationFrame(
        updateMilliseconds
    );
</script>
